name: swachh_flux_mobile
description: Enterprise municipal workforce operations platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Real-time
  dio: ^5.4.3
  socket_io_client: ^3.0.1
  connectivity_plus: ^6.0.3

  # Database & Offline Sync
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # UI & UX
  framer_motion: ^0.0.1 # Conceptually similar to frontend
  google_fonts: ^6.2.1
  lucide_icons: ^0.378.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  camera: ^0.11.0+1

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
