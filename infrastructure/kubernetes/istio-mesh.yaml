apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: swachh-flux-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: national-urban-ops-tls
      hosts:
        - "*.urban.gov.in"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: swachh-flux-virtual-routes
  namespace: default
spec:
  hosts:
    - "*.urban.gov.in"
  gateways:
    - istio-system/swachh-flux-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/auth
      route:
        - destination:
            host: auth-service.default.svc.cluster.local
            port:
              number: 5001
    - match:
        - uri:
            prefix: /api/v1/complaints
      route:
        - destination:
            host: complaint-service.default.svc.cluster.local
            port:
              number: 5002
    - match:
        - uri:
            prefix: /api/v1/gis
      route:
        - destination:
            host: gis-service.default.svc.cluster.local
            port:
              number: 5003
    - match:
        - uri:
            prefix: /api/v1/fleet
      route:
        - destination:
            host: fleet-service.default.svc.cluster.local
            port:
              number: 5004
    - match:
        - uri:
            prefix: /api/v1/erp
      route:
        - destination:
            host: erp-service.default.svc.cluster.local
            port:
              number: 5005
    - match:
        - uri:
            prefix: /api/v1/ai
      route:
        - destination:
            host: ai-service.default.svc.cluster.local
            port:
              number: 5006
    - match:
        - uri:
            prefix: /api/v1/notification
      route:
        - destination:
            host: notification-service.default.svc.cluster.local
            port:
              number: 5007
    - match:
        - uri:
            prefix: /api/v1/telemetry
      route:
        - destination:
            host: telemetry-service.default.svc.cluster.local
            port:
              number: 5008
    - match:
        - uri:
            prefix: /api/v1/reporting
      route:
        - destination:
            host: reporting-service.default.svc.cluster.local
            port:
              number: 5009
    - match:
        - uri:
            prefix: /api/v1/audit
      route:
        - destination:
            host: audit-service.default.svc.cluster.local
            port:
              number: 5010
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: default
spec:
  mtls:
    mode: STRICT
