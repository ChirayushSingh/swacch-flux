_format_version: "3.0"
_transform: true

# --- Global Services & Routes ---
services:
  - name: swachh-auth-service
    url: http://auth-service.default.svc.cluster.local:5001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          second: 50
          hour: 10000
          policy: local

  - name: swachh-complaint-service
    url: http://complaint-service.default.svc.cluster.local:5002
    routes:
      - name: complaint-routes
        paths:
          - /api/v1/complaints
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: kid
          secret_is_base64: false
      - name: rate-limiting
        config:
          second: 100
          hour: 20000
          policy: local

  - name: swachh-telemetry-service
    url: http://telemetry-service.default.svc.cluster.local:5008
    routes:
      - name: telemetry-routes
        paths:
          - /api/v1/telemetry
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          second: 5000 # High throughput rate limiting for IoT devices
          hour: 5000000
          policy: redis
          redis_host: redis-session-cache.default.svc.cluster.local
      - name: ip-restriction
        config:
          allow:
            - "10.0.0.0/8"          # Municipal Intranet Private IP Subnets
            - "164.100.0.0/16"      # National Informatics Centre (NIC) whitelisted gateway IPs

  - name: swachh-reporting-service
    url: http://reporting-service.default.svc.cluster.local:5009
    routes:
      - name: reporting-routes
        paths:
          - /api/v1/reporting
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: kid
          secret_is_base64: false
      - name: rate-limiting
        config:
          second: 10
          hour: 1000

# --- Web Application Firewall (WAF) Plugins ---
plugins:
  - name: cors
    config:
      origins:
        - "*.urban.gov.in"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Tenant-Id
      exposed_headers:
        - X-Trace-Id
      credentials: true
      max_age: 3600
